<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arctic Ramp Sling</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
    <h1>ARCTIC RAMP SLING</h1>
    <p>Drag the penguin like a slingshot to launch up the ramp.</p>
    <button id="startBtn">START LAUNCH</button>
</div>

<div id="hud" class="hidden">
    <div>Distance: <span id="distance">0</span> m</div>
    <div>Speed: <span id="speed">0</span></div>
    <div>Fuel: <span id="fuel">100</span></div>
</div>

<canvas id="game"></canvas>

<script src="game.js"></script>
</body>
</html>
